name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Se ejecuta cada medianoche
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Generate Snake
        # v3 -> d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        # noinspection UnresolvedReference
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        # These inputs are defined by Platane/snk@v3, but some IDE schemas
        # only validate built-in GitHub Actions.
        # noinspection YAMLUndefinedKey, UnresolvedReference
        with:
          github_user_name: Waldoz-X
          outputs: |
            dist/github-snake.svg?color_snake=#0969da&color_dots=#ebedf0,#c6e48b,#7bc96f,#239a3b,#196127
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#79c0ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            
      - name: Push to output branch
        # v4 -> df5cc2bfa78282ded844b354faee141f06b41865
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        # These inputs are defined by crazy-max/ghaction-github-pages@v4.
        # noinspection YAMLUndefinedKey, UnresolvedReference
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
